<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Ranking Oficial - DKTM-JF</title>
    <style>
        body { 
            background: linear-gradient(rgba(20, 10, 30, 0.95), rgba(10, 5, 15, 0.98)), url('https://images.unsplash.com/photo-1534158914592-062992bbe900?q=80&w=1500');
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; color: white; font-family: 'Rajdhani', sans-serif;
        }
        .cat-btn.active { background: #7c3aed; color: white; border-color: #7c3aed; box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }
        .gold-card { background: linear-gradient(180deg, #FFD700 0%, #B8860B 100%); color: black; }
        .silver-card { background: linear-gradient(180deg, #E0E0E0 0%, #808080 100%); color: black; }
        .bronze-card { background: linear-gradient(180deg, #CD7F32 0%, #8B4513 100%); color: white; }
        .atleta-row { background: rgba(20, 20, 20, 0.9); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .atleta-row:hover { border-color: #7c3aed; transform: scale(1.02); background: rgba(124, 58, 237, 0.05); }
        .cat-scroll::-webkit-scrollbar { height: 6px; }
        .cat-scroll::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 10px; }
        
        .etapa-select {
            background: #1a0b2e;
            border: 2px solid #7c3aed;
            color: #d8b4fe;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .etapa-select:focus { box-shadow: 0 0 10px rgba(124,58,237,0.4); }

        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid #7c3aed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c3aed;
            transition: all 0.3s ease;
            z-index: 1000;
            cursor: pointer;
            text-decoration: none;
        }
        .admin-btn:hover {
            background: #7c3aed;
            color: white;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
            transform: rotate(90deg);
        }
    </style>
</head>
<body class="pb-20">

    <a href="admin.html" class="admin-btn" title="Painel Administrativo">
        <i class="fas fa-cog text-xl"></i>
    </a>

    <div class="p-10 text-center animate-fade">
        <h1 class="text-6xl md:text-8xl font-black italic tracking-tighter uppercase leading-none">
            <span class="text-[#7c3aed]">DKTM</span> JF
        </h1>
        <p class="text-gray-400 text-lg md:text-xl tracking-[0.6em] uppercase font-bold mt-4">Ranking DKTM Tenis de Mesa - 2026</p>
    </div>

    <div class="max-w-7xl mx-auto px-6 mb-4 flex justify-center md:justify-end">
        <select id="select-etapa-visualizar" onchange="mudarEtapaVisualizacao()" class="etapa-select w-full md:w-auto">
            </select>
    </div>

    <div class="max-w-7xl mx-auto mb-12 px-6">
        <div class="flex gap-4 overflow-x-auto cat-scroll pb-6" id="menu-categorias"></div>
    </div>

    <div class="text-center mb-10">
        <h2 id="titulo-categoria" class="text-3xl md:text-5xl font-black uppercase italic border-b-4 border-[#7c3aed] inline-block px-12 pb-2">...</h2>
        <p id="subtitulo-etapa" class="text-gray-400 mt-2 font-bold uppercase tracking-widest text-sm">Aguardando...</p>
    </div>

    <div id="podium" class="flex flex-col md:flex-row justify-center items-center md:items-end gap-6 md:gap-8 max-w-5xl mx-auto mb-20 px-4 min-h-[auto] md:h-80"></div>

    <div class="max-w-5xl mx-auto space-y-4 px-6" id="tabela-atletas"></div>

    <script>
        const STORAGE_KEY = 'ranking_altm_multi';
        const CONFIG_KEY = 'config_categorias_dktm';
        const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let LISTA_CATEGORIAS = JSON.parse(localStorage.getItem(CONFIG_KEY)) || [];
        let categoriaAtual = LISTA_CATEGORIAS.length > 0 ? LISTA_CATEGORIAS[0] : "";
        let etapaAtualVisualizacao = "geral";
        let sistema = {};

        // Inicia o Select de Meses
        const selectEtapa = document.getElementById('select-etapa-visualizar');
        let htmlSelect = '<option value="geral">📊 VER RANKING GERAL ACUMULADO</option>';
        MESES.forEach((mes, i) => {
            htmlSelect += `<option value="pts_${i}">📅 Resultado de ${mes}</option>`;
        });
        selectEtapa.innerHTML = htmlSelect;

        function load() {
            let configsSalvas = JSON.parse(localStorage.getItem(CONFIG_KEY)) || [];
            
            // Atualiza as categorias dinamicamente se o admin alterar
            if (JSON.stringify(LISTA_CATEGORIAS) !== JSON.stringify(configsSalvas)) {
                LISTA_CATEGORIAS = configsSalvas;
                if(!LISTA_CATEGORIAS.includes(categoriaAtual) && LISTA_CATEGORIAS.length > 0){
                    categoriaAtual = LISTA_CATEGORIAS[0];
                } else if (LISTA_CATEGORIAS.length === 0) {
                    categoriaAtual = "";
                }
            }

            sistema = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            LISTA_CATEGORIAS.forEach(cat => { if(!sistema[cat]) sistema[cat] = []; });
            
            renderMenu();
            renderRanking();
        }

        function mudarEtapaVisualizacao() {
            etapaAtualVisualizacao = document.getElementById('select-etapa-visualizar').value;
            renderRanking();
        }

        function renderMenu() {
            const menu = document.getElementById('menu-categorias');
            if (LISTA_CATEGORIAS.length === 0) {
                menu.innerHTML = '<span class="text-gray-500 italic uppercase font-bold text-sm">Nenhuma categoria criada no painel admin.</span>';
                return;
            }
            menu.innerHTML = LISTA_CATEGORIAS.map(cat => `
                <button onclick="changeCat('${cat}')" class="cat-btn whitespace-nowrap px-8 py-4 rounded-2xl border-2 border-gray-800 font-black uppercase text-base transition-all ${cat === categoriaAtual ? 'active' : 'text-gray-500 hover:border-[#7c3aed]'}">
                    ${cat}
                </button>
            `).join('');
        }

        function changeCat(cat) {
            categoriaAtual = cat;
            renderMenu();
            renderRanking();
        }

        function renderRanking() {
            const podium = document.getElementById('podium');
            const tabela = document.getElementById('tabela-atletas');

            if (!categoriaAtual) {
                document.getElementById('titulo-categoria').innerText = "SEM CATEGORIAS";
                document.getElementById('subtitulo-etapa').innerText = "Crie uma categoria no painel de controle.";
                podium.innerHTML = '';
                tabela.innerHTML = '';
                return;
            }

            const isGeral = etapaAtualVisualizacao === 'geral';
            document.getElementById('titulo-categoria').innerText = categoriaAtual;
            
            if (isGeral) {
                document.getElementById('subtitulo-etapa').innerText = 'Classificação Geral Acumulada';
            } else {
                const selectEl = document.getElementById('select-etapa-visualizar');
                document.getElementById('subtitulo-etapa').innerText = selectEl.options[selectEl.selectedIndex].text.replace('📅 Resultado de ', 'Desempenho em ');
            }

            let listaOriginal = sistema[categoriaAtual] || [];
            
            // --- LÓGICA DE DESEMPATE CBTM (POR MÊS) ---
            const podiumPorMes = {};
            if (isGeral) {
                MESES.forEach((_, i) => {
                    const key = `pts_${i}`;
                    let notas = listaOriginal.map(a => parseInt(a[key]) || 0).filter(n => n > 0);
                    notas = [...new Set(notas)].sort((a, b) => b - a);
                    podiumPorMes[key] = notas;
                });
            }

            let listaProcessada = listaOriginal.map(atleta => {
                let ptsTotal = 0, ouro = 0, prata = 0, bronze = 0, participacoes = 0;

                if (isGeral) {
                    MESES.forEach((_, i) => {
                        const k = `pts_${i}`;
                        let nota = parseInt(atleta[k]) || 0;
                        if (nota > 0) {
                            ptsTotal += nota;
                            participacoes++;
                            if (podiumPorMes[k] && podiumPorMes[k][0] === nota) ouro++;
                            else if (podiumPorMes[k] && podiumPorMes[k][1] === nota) prata++;
                            else if (podiumPorMes[k] && podiumPorMes[k][2] === nota) bronze++;
                        }
                    });
                } else {
                    ptsTotal = parseInt(atleta[etapaAtualVisualizacao]) || 0;
                }
                return { nome: atleta.nome, pontos: ptsTotal, ouro, prata, bronze, participacoes };
            });

            listaProcessada = listaProcessada.filter(a => a.pontos > 0).sort((a, b) => {
                if (b.pontos !== a.pontos) return b.pontos - a.pontos;
                if (isGeral) {
                    if (b.ouro !== a.ouro) return b.ouro - a.ouro;
                    if (b.prata !== a.prata) return b.prata - a.prata;
                    if (b.bronze !== a.bronze) return b.bronze - a.bronze;
                    if (b.participacoes !== a.participacoes) return b.participacoes - a.participacoes;
                }
                return a.nome.localeCompare(b.nome);
            });

            if(listaProcessada.length > 0) {
                const p1 = listaProcessada[0], p2 = listaProcessada[1], p3 = listaProcessada[2], p4 = listaProcessada[3];
                
                podium.innerHTML = `
                    ${p1 ? `<div class="gold-card w-full md:w-1/3 rounded-[2rem] md:rounded-t-[2rem] flex flex-col items-center justify-center p-6 min-h-[180px] md:h-72 shadow-[0_0_50px_rgba(255,215,0,0.3)] z-10 relative transition hover:scale-110 order-1 md:order-2 border-4 md:border-0 border-yellow-400 mb-4 md:mb-0">
                        <i class="fas fa-crown text-3xl mb-2"></i>
                        <span class="md:hidden text-xs font-black uppercase mb-2 text-black/60">CAMPEÃO</span>
                        <h3 class="font-black text-2xl md:text-3xl text-center uppercase truncate w-full">${p1.nome}</h3>
                        <p class="text-6xl font-black mt-2">${p1.pontos}</p>
                    </div>` : ''}

                    ${p2 ? `<div class="silver-card w-full md:w-1/3 rounded-[2rem] md:rounded-t-[2rem] flex flex-col items-center justify-center p-6 min-h-[140px] md:h-56 shadow-2xl transition hover:scale-105 order-2 md:order-1 mb-4 md:mb-0">
                        <span class="text-sm font-black uppercase opacity-60">2º Lugar</span>
                        <h3 class="font-black text-xl md:text-2xl text-center uppercase truncate w-full mt-2">${p2.nome}</h3>
                        <p class="text-4xl font-black">${p2.pontos}</p>
                    </div>` : ''}
                    
                    ${p3 ? `<div class="bronze-card w-full md:w-1/3 rounded-[2rem] md:rounded-t-[2rem] flex flex-col items-center justify-center p-6 min-h-[140px] md:h-44 shadow-2xl transition hover:scale-105 order-3 md:order-3 mb-4 md:mb-0">
                        <span class="text-sm font-black uppercase opacity-60">3º Lugar</span>
                        <h3 class="font-black text-xl md:text-2xl text-center uppercase truncate w-full mt-2">${p3.nome}</h3>
                        <p class="text-4xl font-black">${p3.pontos}</p>
                    </div>` : ''}
                    
                    ${p4 ? `<div class="bronze-card w-full md:w-1/3 rounded-[2rem] md:rounded-t-[2rem] flex flex-col items-center justify-center p-6 min-h-[140px] md:h-44 shadow-2xl transition hover:scale-105 order-4 md:order-4 opacity-80">
                        <span class="text-sm font-black uppercase opacity-60">3º Lugar (B)</span>
                        <h3 class="font-black text-xl md:text-2xl text-center uppercase truncate w-full mt-2">${p4.nome}</h3>
                        <p class="text-4xl font-black">${p4.pontos}</p>
                    </div>` : ''}
                `;
            } else { 
                podium.innerHTML = '<p class="text-gray-600 font-bold uppercase tracking-widest text-2xl text-center col-span-3 w-full">Aguardando resultados...</p>'; 
            }

            tabela.innerHTML = listaProcessada.map((atleta, i) => {
                // Lógica de cores baseada na posição (Ouro, Prata, Bronze, Padrão)
                let corPosicao = 'text-gray-600'; // 5º lugar em diante (Cinza Escuro)
                if (i === 0) corPosicao = 'text-[#FFD700] drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]'; // 1º Ouro
                else if (i === 1) corPosicao = 'text-[#E0E0E0] drop-shadow-[0_0_10px_rgba(224,224,224,0.5)]'; // 2º Prata
                else if (i === 2 || i === 3) corPosicao = 'text-[#CD7F32] drop-shadow-[0_0_10px_rgba(205,127,50,0.5)]'; // 3º e 4º Bronze

                return `
                <div class="atleta-row p-6 flex items-center justify-between shadow-xl transition hover:border-[#7c3aed]">
                    <div class="flex items-center gap-8">
                        <span class="w-10 text-3xl font-black italic ${corPosicao}">${i+1}</span>
                        <div>
                            <h4 class="font-black uppercase text-xl md:text-2xl text-white tracking-tighter">${atleta.nome}</h4>
                            <p class="text-xs text-[#7c3aed] font-black tracking-[0.3em] uppercase">Atleta DKTM</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-4xl font-black text-white">${atleta.pontos}</span>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">PONTOS</p>
                    </div>
                </div>
                `;
            }).join('');
        }

        setInterval(load, 5000); 
        load();
    </script>
</body>
</html>
